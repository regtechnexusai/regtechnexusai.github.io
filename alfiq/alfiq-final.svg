<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
<title id="title">AlfiQ</title><desc id="desc">AlfiQ wordmark in navy, electric blue, teal and green, with a split i, globe dot and pixelated AI-inspired Q.</desc>
<defs>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1267c9"/><stop offset=".48" stop-color="#082d69"/><stop offset="1" stop-color="#061d49"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00d8ee"/><stop offset=".55" stop-color="#0876e8"/><stop offset="1" stop-color="#142dce"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00e0a0"/><stop offset=".5" stop-color="#20c96a"/><stop offset="1" stop-color="#087e70"/></linearGradient>
 <linearGradient id="qgrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00d6dc"/><stop offset=".48" stop-color="#19c77a"/><stop offset="1" stop-color="#075d87"/></linearGradient>
 <radialGradient id="orb" cx=".3" cy=".22" r=".8"><stop stop-color="#65ffe0"/><stop offset=".38" stop-color="#05aeea"/><stop offset="1" stop-color="#153ac8"/></radialGradient>
</defs>
<g font-family="Arial,Helvetica,sans-serif" font-weight="800" letter-spacing="-10">
 <text x="12" y="165" font-size="166" fill="url(#navy)">alf</text>
</g>
<!-- A single-width, dual-colour i stem: the two strokes meet as one letter. -->
<path d="M315 91 Q315 82 325 82 H338 V165 H309 Z" fill="url(#blue)"/>
<path d="M339 82 H354 Q362 82 362 91 V165 H339 Z" fill="url(#green)"/>
<!-- Glossy globe dot for the merged i. -->
<circle cx="337" cy="43" r="29" fill="url(#orb)"/>
<path d="M311 43 Q337 64 363 36" fill="none" stroke="#eaffff" stroke-width="5" stroke-linecap="round"/>
<circle cx="326" cy="29" r="5" fill="#fff" opacity=".7"/>
<!-- Geometric Q: squared AI-era silhouette with a cut-out and pixelated tail. -->
<path fill="url(#qgrad)" fill-rule="evenodd" d="M431 36 H615 Q659 36 659 80 V125 Q659 169 615 169 H476 Q432 169 432 125 V80 Q432 36 476 36 Z M474 67 Q462 67 462 80 V125 Q462 139 476 139 H615 Q629 139 629 125 V80 Q629 67 615 67 Z"/>
<path d="M565 125 L624 183 L652 183 L592 125 Z" fill="url(#blue)"/>
<!-- Pixel/data trail at the lower-right tail only. -->
<g fill="url(#green)">
 <rect x="625" y="146" width="13" height="13" rx="1"/><rect x="644" y="154" width="11" height="11" rx="1"/>
 <rect x="663" y="163" width="9" height="9" rx="1"/><rect x="635" y="168" width="10" height="10" rx="1"/>
 <rect x="653" y="181" width="8" height="8" rx="1"/><rect x="674" y="183" width="7" height="7" rx="1"/>
</g>
</svg>