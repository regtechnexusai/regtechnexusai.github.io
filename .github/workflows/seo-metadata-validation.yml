name: SEO metadata validation

on:
  pull_request:
    paths:
      - "seo-config.json"
      - "scripts/apply_seo_metadata.py"
      - "scripts/audit_site_quality.py"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/seo-metadata-validation.yml"
      - "**/*.html"
      - "sitemap.xml"
      - "styles.css"
      - "assets/**/*.svg"
      - "scripts/test_homepage_lcp.py"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - "seo-config.json"
      - "scripts/apply_seo_metadata.py"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/seo-metadata-validation.yml"
      - "**/*.html"
      - "sitemap.xml"
      - "styles.css"
      - "assets/**/*.svg"
      - "scripts/test_homepage_lcp.py"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Checkout pinned TradeGuard source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: regtechnexusai/tradeguard
          ref: 2b5b514b94ff92a2f4500ffb7f9894d84d05ce2e
          path: tradeguard-source

      - name: Set up Node.js for product regression tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Run ICMS and TradeGuard synthetic regression tests
        run: node --test tests/icms-regression.test.cjs tests/tradeguard-rules-regression.test.mjs

      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/regtech-browser-tools" --no-save --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/regtech-browser-tools/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run AlfiQ, ICMS and TradeGuard browser workflow tests
        run: |
          set -euo pipefail
          mkdir -p tradeguard
          cp -a tradeguard-source/. tradeguard/
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/regtech-test-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/alfiq/ >/dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/regtech-browser-tools/node_modules" TEST_BASE_URL=http://127.0.0.1:4173 node --test tests/browser-workflow-regression.cjs

      - name: Validate homepage LCP asset remains filter-free
        run: python3 scripts/test_homepage_lcp.py

      - name: Validate generated WebP logo and transfer-size budget
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/regtech-image-tools" --no-save --no-audit --no-fund sharp@0.34.5
          NODE_PATH="$RUNNER_TEMP/regtech-image-tools/node_modules" OUTPUT="$RUNNER_TEMP/regtech-nexus-ai-logo.webp" node <<'NODE'
          const sharp = require("sharp");
          const fs = require("fs");
          (async () => {
            const source = "regtech-nexus-ai-logo-2026.png";
            const output = process.env.OUTPUT;
            const original = await sharp(source).metadata();
            if (original.width !== 1391 || original.height !== 476) throw new Error("Unexpected source logo dimensions");
            await sharp(source).resize({ width: 460, withoutEnlargement: true }).webp({ quality: 90, effort: 5, alphaQuality: 100 }).toFile(output);
            const result = await sharp(output).metadata();
            const bytes = fs.statSync(output).size;
            if (result.width !== 460 || result.format !== "webp" || bytes > 120000) throw new Error("WebP output failed the 120 KB budget: " + JSON.stringify({result, bytes}));
            console.log("PASS: generated WebP logo " + bytes + " bytes vs PNG " + fs.statSync(source).size + " bytes");
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Validate configured page paths and metadata application
        run: |
          set -euo pipefail
          python3 -m json.tool seo-config.json >/dev/null
          python3 - <<'PY'
          import json
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          config_path = Path("seo-config.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          with tempfile.TemporaryDirectory(prefix="seo-metadata-") as temp:
              site = Path(temp)
              for relative in config.get("pages", {}):
                  source = Path("tradeguard-source") / Path(relative).relative_to("tradeguard") if relative.startswith("tradeguard/") else Path(relative)
                  if not source.is_file():
                      raise SystemExit(f"Configured SEO page does not exist: {relative} (source: {source})")
                  target = site / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
              sitemap = Path("sitemap.xml")
              if sitemap.is_file():
                  shutil.copy2(sitemap, site / "sitemap.xml")
              command = [
                  sys.executable,
                  "scripts/apply_seo_metadata.py",
                  "--site-dir", str(site),
                  "--config", str(config_path),
              ]
              subprocess.run(command, check=True)
              subprocess.run(command + ["--check"], check=True)
              audit = [sys.executable, "scripts/audit_site_quality.py", "--site-dir", str(site), "--config", str(config_path), "--output", str(site / "site-quality-report.md")]
              subprocess.run(audit, check=True)
          PY
