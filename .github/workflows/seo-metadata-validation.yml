name: SEO metadata validation

on:
  pull_request:
    paths:
      - "seo-config.json"
      - "scripts/apply_seo_metadata.py"
      - "scripts/audit_site_quality.py"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/seo-metadata-validation.yml"
      - "**/*.html"
      - "sitemap.xml"
      - "styles.css"
      - "assets/**/*.svg"
      - "scripts/test_homepage_lcp.py"
      - "scripts/optimize_logo.cjs"
      - "site-wide-shell.js"
      - "regtech-nexus-ai-logo-2026.png"
  push:
    branches:
      - main
    paths:
      - "seo-config.json"
      - "scripts/apply_seo_metadata.py"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/seo-metadata-validation.yml"
      - "**/*.html"
      - "sitemap.xml"
      - "styles.css"
      - "assets/**/*.svg"
      - "scripts/test_homepage_lcp.py"
      - "scripts/optimize_logo.cjs"
      - "site-wide-shell.js"
      - "regtech-nexus-ai-logo-2026.png"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Test responsive logo optimisation
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rt-image-opt" sharp@0.34.3 --no-audit --no-fund
          mkdir -p "$RUNNER_TEMP/logo-test"
          cp regtech-nexus-ai-logo-2026.png "$RUNNER_TEMP/logo-test/"
          cp site-wide-shell.js "$RUNNER_TEMP/logo-test/"
          printf '%s\n' '<img src="regtech-nexus-ai-logo-2026.png">' '<meta property="og:image" content="https://regtechnexusai.com/regtech-nexus-ai-logo-2026.png">' > "$RUNNER_TEMP/logo-test/index.html"
          SHARP_MODULE_PATH="$RUNNER_TEMP/rt-image-opt/node_modules/sharp" node scripts/optimize_logo.cjs "$RUNNER_TEMP/logo-test"
          node - "$RUNNER_TEMP/logo-test" <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = process.argv[2];
          const html = fs.readFileSync(path.join(dir, 'index.html'), 'utf8');
          const shell = fs.readFileSync(path.join(dir, 'site-wide-shell.js'), 'utf8');
          const png = fs.statSync(path.join(dir, 'regtech-nexus-ai-logo-2026.png')).size;
          const webp = fs.statSync(path.join(dir, 'regtech-nexus-ai-logo-2026.webp')).size;
          if (!html.includes('src="regtech-nexus-ai-logo-2026.webp"')) throw new Error('HTML logo src was not upgraded');
          if (!html.includes('og:image" content="https://regtechnexusai.com/regtech-nexus-ai-logo-2026.png"')) throw new Error('Social preview PNG reference must remain unchanged');
          if (!shell.includes('/regtech-nexus-ai-logo-2026.webp')) throw new Error('Shared shell logo was not upgraded');
          if (webp >= png) throw new Error('WebP logo must be smaller than the source PNG');
          console.log('PASS: responsive WebP logo generated; HTML and shared-shell references updated; social preview retained.');
          JS

      - name: Checkout pinned TradeGuard source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: regtechnexusai/tradeguard
          ref: eaf061382cb278eb657eb018f48132561536b6c1
          path: tradeguard-source

      - name: Validate homepage LCP asset remains filter-free
        run: python3 scripts/test_homepage_lcp.py

      - name: Validate configured page paths and metadata application
        run: |
          set -euo pipefail
          python3 -m json.tool seo-config.json >/dev/null
          python3 - <<'PY'
          import json
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          config_path = Path("seo-config.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          with tempfile.TemporaryDirectory(prefix="seo-metadata-") as temp:
              site = Path(temp)
              for relative in config.get("pages", {}):
                  source = Path("tradeguard-source") / Path(relative).relative_to("tradeguard") if relative.startswith("tradeguard/") else Path(relative)
                  if not source.is_file():
                      raise SystemExit(f"Configured SEO page does not exist: {relative} (source: {source})")
                  target = site / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
              sitemap = Path("sitemap.xml")
              if sitemap.is_file():
                  shutil.copy2(sitemap, site / "sitemap.xml")
              command = [
                  sys.executable,
                  "scripts/apply_seo_metadata.py",
                  "--site-dir", str(site),
                  "--config", str(config_path),
              ]
              subprocess.run(command, check=True)
              subprocess.run(command + ["--check"], check=True)
              audit = [sys.executable, "scripts/audit_site_quality.py", "--site-dir", str(site), "--config", str(config_path), "--output", str(site / "site-quality-report.md")]
              subprocess.run(audit, check=True)
          PY
