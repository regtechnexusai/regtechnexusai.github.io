name: AlfiQ document intake and synchronized review regression

on:
  pull_request:
    paths:
      - "alfiq/**"
      - ".github/scripts/alfiq_document_regression.py"
      - ".github/workflows/alfiq-document-regression.yml"
      - ".github/workflows/deploy-pages.yml"
  push:
    branches: [main]
    paths:
      - "alfiq/**"
      - ".github/scripts/alfiq_document_regression.py"
      - ".github/workflows/alfiq-document-regression.yml"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

jobs:
  alfiq-document-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Prepare pinned self-hosted parser assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alfiq-pdfjs" "$RUNNER_TEMP/alfiq-mammoth" alfiq/vendor
          PDF_TGZ=$(npm pack pdfjs-dist@6.5.438 --pack-destination "$RUNNER_TEMP/alfiq-pdfjs" --silent)
          tar -xzf "$RUNNER_TEMP/alfiq-pdfjs/$PDF_TGZ" -C "$RUNNER_TEMP/alfiq-pdfjs" package/build/pdf.mjs package/build/pdf.worker.mjs
          cp "$RUNNER_TEMP/alfiq-pdfjs/package/build/pdf.mjs" alfiq/vendor/pdf.mjs
          cp "$RUNNER_TEMP/alfiq-pdfjs/package/build/pdf.worker.mjs" alfiq/vendor/pdf.worker.mjs
          MAMMOTH_TGZ=$(npm pack mammoth@1.13.0 --pack-destination "$RUNNER_TEMP/alfiq-mammoth" --silent)
          tar -xzf "$RUNNER_TEMP/alfiq-mammoth/$MAMMOTH_TGZ" -C "$RUNNER_TEMP/alfiq-mammoth" package/mammoth.browser.min.js
          cp "$RUNNER_TEMP/alfiq-mammoth/package/mammoth.browser.min.js" alfiq/vendor/mammoth.browser.min.js
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-playwright
          python -m playwright install --with-deps chromium
      - name: Start local static site
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/alfiq-http.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/alfiq-http.pid"
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/alfiq/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/alfiq-http.log"
          exit 1
      - name: Run local PDF DOCX and synchronized-pane tests
        run: pytest -v .github/scripts/alfiq_document_regression.py
