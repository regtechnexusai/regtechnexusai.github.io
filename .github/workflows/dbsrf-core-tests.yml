name: DBSRF Core Tests
on:
  pull_request:
    paths:
      - "fintech-intelligence-hub/digital-bank-readiness/**"
      - ".github/workflows/dbsrf-core-tests.yml"
  push:
    branches: [main]
    paths:
      - "fintech-intelligence-hub/digital-bank-readiness/**"
      - ".github/workflows/dbsrf-core-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Validate browser UI JavaScript syntax
        run: node --check fintech-intelligence-hub/digital-bank-readiness/assets/dbsrf-ui.js
      - name: Run DBSRF core tests
        run: node --test fintech-intelligence-hub/digital-bank-readiness/tests/*.test.js
