name: GaaS report quality checks

on:
  pull_request:
    paths:
      - "gaas/**"
      - ".github/workflows/gaas-report-quality.yml"
  push:
    branches: [main]
    paths:
      - "gaas/**"
      - ".github/workflows/gaas-report-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-gaas-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check gaas/gaas.js
      - name: Check report QA safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          js = Path("gaas/gaas.js").read_text()
          html = Path("gaas/index.html").read_text()
          css = Path("gaas/gaas.css").read_text()
          required = [
              "function buildChatGPTPrompt", "function generatePlanOutput",
              "COUNTRY_OPTIONS", "function sampleHint", "country-filter", "plan-source-files",
              "FIELDS NOT PROVIDED",
              "Bangladesh Financial Intelligence Unit", "does not search those authorities",
              "placeholder=", "Attach them manually", 'const isCountry=f[0]==="jurisdiction"||f[0]==="jurisdictions";',
              "const validation=validatePlan(plan,values);", 'const chatUrl="https://chatgpt.com/";',
              "The URL does not contain your form data.", "Input validation notes"
          ]
          missing = [item for item in required if item not in js]
          assert not missing, f"Missing QA safeguards: {missing}"
          assert 'href="gaas.css?v=10"' in html
          assert 'src="gaas.js?v=11"' in html
          assert "@page{size:A4 portrait;margin:8mm}" in css
          assert "plan-result-document" in css and "position:static!important" in css
          print("GaaS report QA safeguards present.")
          PY