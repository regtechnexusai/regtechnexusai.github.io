name: GaaS report quality checks

on:
  pull_request:
    paths:
      - "gaas/**"
      - ".github/workflows/gaas-report-quality.yml"
  push:
    branches: [main]
    paths:
      - "gaas/**"
      - ".github/workflows/gaas-report-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-gaas-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check gaas/gaas-plan-form-v13.js
      - name: Check report QA safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          js = Path("gaas/gaas-plan-form-v13.js").read_text()
          html = Path("gaas/index.html").read_text()
          css = Path("gaas/gaas.css").read_text()
          required = [
              "function generatePlanOutput",
              "COUNTRY_OPTIONS", "function sampleHint", "country-filter",
              "Bangladesh Financial Intelligence Unit", "without searching or retrieving publications",
              "placeholder=", 'const isCountry=f[0]==="jurisdiction"||f[0]==="jurisdictions";',
              "data-country-select=\"true\"", "target.replaceChildren(fragment)", "const missing=Array.isArray(value)?value.length===0:!String(value).trim();",
              "const validation=validatePlan(plan,values);", "GAAS LIVE RESEARCH · DIRECT SUBMISSION", "Run live regulatory research",
              "gaas-research-api-staging.regtechnexusai.workers.dev/api/research", "turnstileToken:liveToken", "Input validation notes", "Not supported in this public preview. No files are uploaded or processed."
          ]
          missing = [item for item in required if item not in js]
          assert not missing, f"Missing QA safeguards: {missing}"
          assert "plan-source-files" not in js, "Obsolete document upload control must remain removed"
          html_required = [
              "FATF &amp; BASEL", "IFRS / IAS", "FinTech", "ICMS Manager",
              "ICMS Gap Analyzer", "TradeGuard", "MD/CEO Performance Evaluation",
              "No default country", "Verified", "Partially verified", "Research pending", "Not covered",
              "GaaS integration not yet connected"
          ]
          missing_html = [item for item in html_required if item not in html]
          assert not missing_html, f"Missing global product coverage: {missing_html}"
          assert 'href="gaas.css?v=14"' in html
          assert 'src="gaas-plan-form-v13.js?v=15"' in html
          assert "if(isCountry):" not in js  # country UI is guarded by the exact jurisdiction field predicate
          assert 'if(isCountry){' in js and 'class="country-filter"' in js
          assert 'const isCountry=f[0]==="jurisdiction"||f[0]==="jurisdictions";' in js
          assert "}else{\n  control='<select" in js
          assert 'data-country-select="true"' in js
          assert "@page{size:A4 portrait;margin:8mm}" in css
          assert "plan-result-document" in css and "position:static!important" in css
          print("GaaS report QA safeguards present.")
          PY