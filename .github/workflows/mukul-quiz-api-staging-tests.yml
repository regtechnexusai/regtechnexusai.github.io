name: MUKUL Quiz API Staging Scaffold Tests

on:
  pull_request:
    paths:
      - 'mukul/quiz-api-staging/**'
      - '.github/workflows/mukul-quiz-api-staging-tests.yml'
  push:
    branches: [main]
    paths:
      - 'mukul/quiz-api-staging/**'
      - '.github/workflows/mukul-quiz-api-staging-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-scaffold-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mukul/quiz-api-staging/requirements.txt
      - name: Install API test dependencies
        run: python -m pip install -r mukul/quiz-api-staging/requirements.txt
      - name: Compile API source
        run: python -m compileall -q mukul/quiz-api-staging/app mukul/quiz-api-staging/tests
      - name: Run API security smoke tests
        working-directory: mukul/quiz-api-staging
        run: python -m pytest -q
