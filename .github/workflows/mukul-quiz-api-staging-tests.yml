name: MUKUL Quiz API Staging Scaffold Tests

on:
  pull_request:
    paths:
      - 'mukul/quiz-api-staging/**'
      - 'mukul/quiz-database/schema.sql'
      - '.github/workflows/mukul-quiz-api-staging-tests.yml'
  push:
    branches: [main]
    paths:
      - 'mukul/quiz-api-staging/**'
      - 'mukul/quiz-database/schema.sql'
      - '.github/workflows/mukul-quiz-api-staging-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-scaffold-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mukul/quiz-api-staging/requirements.txt
      - name: Install API test dependencies
        run: python -m pip install -r mukul/quiz-api-staging/requirements.txt
      - name: Compile API source
        run: python -m compileall -q mukul/quiz-api-staging/app mukul/quiz-api-staging/tests
      - name: Run API security smoke tests
        working-directory: mukul/quiz-api-staging
        run: python -m pytest -q

  docker-postgres-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_DB: mukul_quiz_staging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-bootstrap-password-not-for-production
      MUKUL_API_PASSWORD: ci-runtime-password-not-for-production
      DATABASE_URL: postgresql://mukul_api:ci-runtime-password-not-for-production@db:5432/mukul_quiz_staging
      ADMIN_API_TOKEN: ci-admin-token-not-for-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create isolated test environment
        run: |
          cat > mukul/quiz-api-staging/.env <<EOF
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          MUKUL_API_PASSWORD=${MUKUL_API_PASSWORD}
          DATABASE_URL=${DATABASE_URL}
          ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
          EOF
      - name: Build and start PostgreSQL plus API
        working-directory: mukul/quiz-api-staging
        run: docker compose --env-file .env up --build --detach
      - name: Verify schema, runtime privileges, readiness and admin guard
        working-directory: mukul/quiz-api-staging
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8081/readyz > /tmp/ready.json; then
              break
            fi
            sleep 2
          done
          grep -q '"status":"ready"' /tmp/ready.json
          table_count=$(docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('languages','questions','question_version_answers','question_reviews')")
          test "$table_count" = "4"
          role_flags=$(docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT rolsuper::text || ',' || rolcreatedb::text || ',' || rolcreaterole::text FROM pg_roles WHERE rolname='mukul_api'")
          test "$role_flags" = "false,false,false"
          table_grants=$(docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT COUNT(*) FROM information_schema.role_table_grants WHERE grantee='mukul_api'")
          test "$table_grants" = "0"
          unauth_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/v1/admin/health)
          test "$unauth_status" = "401"
          auth_status=$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $ADMIN_API_TOKEN" http://127.0.0.1:8081/v1/admin/health)
          test "$auth_status" = "200"
      - name: Show service logs on failure
        if: failure()
        working-directory: mukul/quiz-api-staging
        run: docker compose --env-file .env logs --no-color
      - name: Tear down disposable stack
        if: always()
        working-directory: mukul/quiz-api-staging
        run: docker compose --env-file .env down --volumes --remove-orphans
