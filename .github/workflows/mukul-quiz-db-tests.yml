name: MUKUL Quiz Database PostgreSQL Tests

on:
  pull_request:
    paths:
      - 'mukul/quiz-database/**'
      - '.github/workflows/mukul-quiz-db-tests.yml'
  push:
    branches: [main]
    paths:
      - 'mukul/quiz-database/**'
      - '.github/workflows/mukul-quiz-db-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-schema-and-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mukul_test
          POSTGRES_PASSWORD: mukul_test_password
          POSTGRES_DB: mukul_quiz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mukul_test -d mukul_quiz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema to a disposable database
        env:
          PGPASSWORD: mukul_test_password
        run: psql -h localhost -U mukul_test -d mukul_quiz_test -v ON_ERROR_STOP=1 -f mukul/quiz-database/schema.sql
      - name: Run positive and negative regression tests
        env:
          PGPASSWORD: mukul_test_password
        run: psql -h localhost -U mukul_test -d mukul_quiz_test -v ON_ERROR_STOP=1 -f mukul/quiz-database/tests/publication-regression.sql
