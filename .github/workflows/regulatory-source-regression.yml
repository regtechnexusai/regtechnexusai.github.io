name: Regulatory source and static regression checks
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 17 * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run static regression checks
        run: python .github/scripts/regression_check.py
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regulatory-source-and-regression-report
          path: quality-assurance/regression-report.md
          if-no-files-found: warn
          retention-days: 90
