name: Functional regression — public tools

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/scripts/functional_regression.py"
      - ".github/workflows/functional-regression.yml"

permissions:
  contents: read

jobs:
  production-functional-regression:
    name: Production functional regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-playwright
          python -m playwright install --with-deps chromium

      - name: Run read-only production functional tests
        run: |
          pytest -v .github/scripts/functional_regression.py --junitxml=functional-regression-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-regression-results
          path: functional-regression-results.xml
          if-no-files-found: warn
          retention-days: 90
