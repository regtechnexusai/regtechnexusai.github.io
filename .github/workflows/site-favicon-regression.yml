name: Site favicon regression
on:
  pull_request:
    paths:
      - ".github/scripts/site_favicon.js"
      - ".github/scripts/icms_logo_fallback_png.js"
      - ".github/scripts/regression_check.py"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/site-favicon-regression.yml"
permissions:
  contents: read
jobs:
  site-favicon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install pinned image tooling
        run: npm install --prefix "$RUNNER_TEMP/site-favicon-test" --no-save --no-audit --no-fund sharp@0.34.5
      - name: Run synthetic favicon self-test
        run: NODE_PATH="$RUNNER_TEMP/site-favicon-test/node_modules" node .github/scripts/site_favicon.js --self-test
      - name: Run transformation against a clean repository archive
        run: |
          set -euo pipefail
          test_site="$RUNNER_TEMP/site-favicon-test-site"
          mkdir -p "$test_site"
          git archive HEAD | tar -x -C "$test_site"
          NODE_PATH="$RUNNER_TEMP/site-favicon-test/node_modules" node "$test_site/.github/scripts/site_favicon.js" --site-dir "$test_site"
          test -s "$test_site/regtech-nexus-ai-favicon-128.png"
          NODE_PATH="$RUNNER_TEMP/site-favicon-test/node_modules" node - "$test_site" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const sharp = require("sharp");
          (async () => {
            const root = process.argv[2];
            const favicon = path.join(root, "regtech-nexus-ai-favicon-128.png");
            const metadata = await sharp(favicon).metadata();
            const bytes = fs.statSync(favicon).size;
            if (metadata.format !== "png" || metadata.width !== 128 || metadata.height !== 128 || bytes > 30000) {
              throw new Error("Site favicon output failed its format, dimensions or size gate: " + JSON.stringify({ metadata, bytes }));
            }
            console.log("PASS: assembled repository favicon is 128x128 PNG and " + bytes + " bytes");
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Test ICMS logo fallback on clean repository archive
        run: |
          set -euo pipefail
          icms_site="$RUNNER_TEMP/icms-logo-fallback-test-site"
          mkdir -p "$icms_site"
          git archive HEAD | tar -x -C "$icms_site"
          NODE_PATH="$RUNNER_TEMP/site-favicon-test/node_modules" node "$icms_site/.github/scripts/icms_logo_fallback_png.js" --self-test
          NODE_PATH="$RUNNER_TEMP/site-favicon-test/node_modules" node "$icms_site/.github/scripts/icms_logo_fallback_png.js" --site-dir "$icms_site"
          test -s "$icms_site/regtech-nexus-ai-logo-460.png"
          NODE_PATH="$RUNNER_TEMP/site-favicon-test/node_modules" node - "$icms_site" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const sharp = require("sharp");
          (async () => {
            const root = process.argv[2];
            const png = path.join(root, "regtech-nexus-ai-logo-460.png");
            const page = path.join(root, "icms-2026/index.html");
            const meta = await sharp(png).metadata();
            const bytes = fs.statSync(png).size;
            const html = fs.readFileSync(page, "utf8");
            const header = '<img class="brand-logo" src="../regtech-nexus-ai-logo-460.png" alt="RegTech Nexus AI" width="160" height="55">';
            const footer = '<img class="brand-logo" src="../regtech-nexus-ai-logo-460.png" alt="RegTech Nexus AI" width="248" height="80" loading="lazy" decoding="async">';
            const oldHeader = '<img class="brand-logo" src="../regtech-nexus-ai-logo-2026.png" alt="RegTech Nexus AI" width="160" height="55">';
            const oldFooter = '<img class="brand-logo" src="../regtech-nexus-ai-logo-2026.png" alt="RegTech Nexus AI" width="248" height="80" loading="lazy" decoding="async">';
            if (meta.format !== "png" || meta.width !== 460 || meta.height !== 157 || bytes > 120000) throw new Error("ICMS fallback PNG format, dimensions or 120 KB gate failed: " + JSON.stringify({meta,bytes}));
            if (html.split(header).length !== 2 || html.split(footer).length !== 2 || html.includes(oldHeader) || html.includes(oldFooter)) throw new Error("ICMS fallback markup did not verify exactly");
            if (html.split('<source srcset="../regtech-nexus-ai-logo-2026.webp" type="image/webp">').length !== 3) throw new Error("WebP picture sources were not preserved");
            if (!html.includes('og:image') || !html.includes('twitter:image')) throw new Error("Social image metadata missing");
            console.log("PASS: clean archive generated ICMS 460x157 PNG fallback (" + bytes + " bytes) and rewrote only two picture img src attributes");
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload ICMS logo fallback preview
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: icms-logo-fallback-preview
          path: |
            ${{ runner.temp }}/icms-logo-fallback-test-site/regtech-nexus-ai-logo-460.png
            ${{ runner.temp }}/icms-logo-fallback-test-site/icms-2026/index.html
          retention-days: 7

