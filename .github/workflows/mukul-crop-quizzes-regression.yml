name: MUKUL Crop Quiz Regression
on:
  push:
    paths:
      - 'mukul/knowledge/crop-quizzes.html'
      - 'tests/mukul-crop-quizzes.test.cjs'
      - '.github/workflows/mukul-crop-quizzes-regression.yml'
  pull_request:
    paths:
      - 'mukul/knowledge/crop-quizzes.html'
      - 'tests/mukul-crop-quizzes.test.cjs'
      - '.github/workflows/mukul-crop-quizzes-regression.yml'
  workflow_dispatch:
jobs:
  quiz-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Run source-level quiz regression tests
        run: node tests/mukul-crop-quizzes.test.cjs
