name: Deploy RegTech Nexus AI site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout root site
        uses: actions/checkout@v4
        with:
          path: root-site

      - name: Checkout TradeGuard
        uses: actions/checkout@v4
        with:
          repository: regtechnexusai/tradeguard
          ref: main
          path: site/tradeguard

      # PayScale source is canonical for the calculator and pension module; keep source checkout on main.
      # PayScale v1.38 preserves calculation logic Version 1.33, improves pension PDF print contrast and page flow, and consistently labels the main calculator and pension page “PayScale 2026 Calculator”.
      # Rebuild this deployment whenever the PayScale source repo is updated on main.
      # Pension visual refresh is maintained in the canonical PayScale source repository.
      # Rebuild after PayScale footer contrast updates in the canonical source repository.
      # Rebuild after the PayScale redesign stylesheet cache version is incremented.
      # Rebuild after adding the Google Translate launcher to both PayScale pages.
      # Rebuild after fixing the Google Translate Websites launch workflow on PayScale pages.
      # Refresh PayScale translation asset URLs after the launcher correction.
      # Rebuild after PayScale translation UX v3: visible URL, confirmed copy, compact selector and contrast fixes.
      # Rebuild after replacing PayScale URL launcher with embedded FinTech Hub-style Google Translate widget.
      # Rebuild after allowing Google Translate script, frame, image and connection origins in PayScale CSP.
      # Rebuild after setting Bengali as the PayScale Google Translate source language.
      # Rebuild after mirroring the FinTech Hub language panel, callback and script loading on PayScale.
      # Rebuild after removing the duplicate Google Translate loader and refreshing PayScale translation CSS.
      # Rebuild after matching the FinTech Hub's direct deferred Google Translate script loading.
      # Rebuild after PayScale translation regression-test alignment and republish both calculator pages.
      - name: Checkout original PayScale calculator
        uses: actions/checkout@v4
        with:
          repository: regtechnexusai/PayScale-2026-calculator
          ref: main
          path: payscale-source

      - name: Assemble site
        run: |
          mkdir -p site

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.md' \
            --exclude='payscale-2026' \
            --exclude='PayScale-2026-calculator' \
            --exclude='/mukul/quiz-api-staging/***' \
            root-site/ site/

          mkdir -p site/payscale-2026

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.md' \
            payscale-source/ \
            site/payscale-2026/
      - name: Apply site-wide email composer to assembled PayScale pages
        run: |
          cp root-site/site-email.js site/payscale-2026/site-email.js
          python3 - <<'PY'
          from pathlib import Path

          for page in Path("site/payscale-2026").glob("*.html"):
              content = page.read_text(encoding="utf-8")
              if "site-email.js" not in content:
                  content = content.replace(
                      "</body>",
                      '<script src="./site-email.js" defer></script></body>',
                  )
              page.write_text(content, encoding="utf-8")
          PY


      - name: Apply unified site header/footer styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          site = Path("site")
          stylesheet = '<link rel="stylesheet" href="/site-wide-shell.css?v=20261016-tradeguard-shell1" data-regtech-site-shell="true">'
          protected = {
              "index.html",
              "googleb678d3f045b8f91e.html",
              "fintech-intelligence-hub/googleb678d3f045b8f91e.html",
          }
          for page in site.rglob("*.html"):
              relative = page.relative_to(site).as_posix()
              # PayScale ships its own page-specific visual system. The global shell
              # treats every <header> and <footer> as the site shell, overriding
              # PayScale's hero, form/output contrast and footer layout. Keep
              # PayScale pages on their own stylesheets; do not alter calculations.
              if relative.startswith("payscale-2026/"):
                  continue
              if relative in protected:
                  continue
              content = page.read_text(encoding="utf-8")
              # Replace an older relative reference, if present, so nested pages use the same root asset.
              content = re.sub(r"""<link\b[^>]*href=["'][^"']*site-wide-shell\.css(?:\?[^"']*)?["'][^>]*>""", "", content, flags=re.I)
              if "</head>" not in content.lower():
                  continue
              match = re.search(r"</head>", content, flags=re.I)
              content = content[:match.start()] + "  " + stylesheet + "\n" + content[match.start():]
              page.write_text(content, encoding="utf-8")
          PY
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
