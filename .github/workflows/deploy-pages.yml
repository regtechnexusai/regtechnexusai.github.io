name: Deploy RegTech Nexus AI site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout root site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: root-site

      - name: Checkout TradeGuard
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: regtechnexusai/tradeguard
          ref: 86819077a01657bec70fbf5a126ddf4760598cec
          path: site/tradeguard

      # PayScale source is canonical for the calculator and pension module; pin to the reviewed upstream commit.
      # PayScale v1.38 preserves calculation logic Version 1.33, improves pension PDF print contrast and page flow, and consistently labels the main calculator and pension page “PayScale 2026 Calculator”.
      # Rebuild this deployment whenever the PayScale source repo is updated on main.
      # 19 Nov 2026: local scripts deferred in order and footer logo served from generated WebP; formulas remain unchanged.
      # Pension visual refresh is maintained in the canonical PayScale source repository.
      # Rebuild after PayScale footer contrast updates in the canonical source repository.
      # Rebuild after the PayScale redesign stylesheet cache version is incremented.
      # Rebuild after adding the Google Translate launcher to both PayScale pages.
      # Rebuild after fixing the Google Translate Websites launch workflow on PayScale pages.
      # Refresh PayScale translation asset URLs after the launcher correction.
      # Rebuild after PayScale translation UX v3: visible URL, confirmed copy, compact selector and contrast fixes.
      # Rebuild after replacing PayScale URL launcher with embedded FinTech Hub-style Google Translate widget.
      # Rebuild after allowing Google Translate script, frame, image and connection origins in PayScale CSP.
      # Rebuild after setting Bengali as the PayScale Google Translate source language.
      # Rebuild after mirroring the FinTech Hub language panel, callback and script loading on PayScale.
      # Rebuild after removing the duplicate Google Translate loader and refreshing PayScale translation CSS.
      # Rebuild after matching the FinTech Hub's direct deferred Google Translate script loading.
      # Rebuild after PayScale translation regression-test alignment and republish both calculator pages.
      # Republish PayScale pages with reduced top spacing.
      - name: Checkout original PayScale calculator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: regtechnexusai/PayScale-2026-calculator
          ref: ac4eb5b5bb5f6dae21418ebabf3d88f201ab226e
          path: payscale-source

      - name: Assemble site
        run: |
          mkdir -p site

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.md' \
            --exclude='payscale-2026' \
            --exclude='PayScale-2026-calculator' \
            --exclude='/mukul/quiz-api-staging/***' \
            root-site/ site/

          mkdir -p site/payscale-2026

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.md' \
            payscale-source/ \
            site/payscale-2026/
      - name: Normalize PayScale shared-shell stylesheet
        run: |
          set -euo pipefail
          python3 root-site/.github/scripts/payscale_shell_css.py --self-test
          python3 root-site/.github/scripts/payscale_shell_css.py --page-dir site/payscale-2026

      - name: Apply PayScale third-party privacy disclosure
        run: |
          set -euo pipefail
          python3 root-site/.github/scripts/payscale_privacy_disclosure.py --self-test
          python3 root-site/.github/scripts/payscale_privacy_disclosure.py --site-dir site/payscale-2026

      - name: Generate optimized homepage logo WebP
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/regtech-image-tools" --no-save --no-audit --no-fund sharp@0.34.5
          NODE_PATH="$RUNNER_TEMP/regtech-image-tools/node_modules" node <<'NODE'
          const sharp = require("sharp");
          const input = "root-site/regtech-nexus-ai-logo-2026.png";
          const output = "site/regtech-nexus-ai-logo-2026.webp";
          (async () => {
            const metadata = await sharp(input).metadata();
            if (metadata.width !== 1391 || metadata.height !== 476) {
              throw new Error("Unexpected source logo dimensions; refusing an unreviewed transformation");
            }
            await sharp(input)
              .resize({ width: 460, withoutEnlargement: true })
              .webp({ quality: 90, effort: 5, alphaQuality: 100 })
              .toFile(output);
            const result = await sharp(output).metadata();
            const fs = require("fs");
            const bytes = fs.statSync(output).size;
            if (result.width !== 460 || result.format !== "webp" || bytes > 120000) {
              throw new Error("Optimized logo failed dimensions, format or 120 KB size gate: " + JSON.stringify({result, bytes}));
            }
            console.log("Optimized homepage logo: " + bytes + " bytes (PNG source: " + fs.statSync(input).size + " bytes)");
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Generate optimized AlfiQ GaaS logo WebP
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/regtech-image-tools/node_modules" node root-site/.github/scripts/gaas_logo_webp.js --self-test
          NODE_PATH="$RUNNER_TEMP/regtech-image-tools/node_modules" node root-site/.github/scripts/gaas_logo_webp.js --site-dir site

      - name: Generate optimized PayScale favicon from pinned source
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/regtech-image-tools/node_modules" node root-site/.github/scripts/payscale_favicon.js --self-test
          NODE_PATH="$RUNNER_TEMP/regtech-image-tools/node_modules" node root-site/.github/scripts/payscale_favicon.js --site-dir site

      - name: Generate optimized site-wide favicon from pinned square logo
        run: |
          set -euo pipefail
          NODE_PATH="$RUNNER_TEMP/regtech-image-tools/node_modules" node root-site/.github/scripts/site_favicon.js --self-test
          NODE_PATH="$RUNNER_TEMP/regtech-image-tools/node_modules" node root-site/.github/scripts/site_favicon.js --site-dir site

      - name: Bundle pinned AlfiQ document parsers (self-hosted)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/alfiq-pdfjs" "$RUNNER_TEMP/alfiq-mammoth" site/alfiq/vendor
          PDF_TGZ=$(npm pack pdfjs-dist@6.5.438 --pack-destination "$RUNNER_TEMP/alfiq-pdfjs" --silent)
          tar -xzf "$RUNNER_TEMP/alfiq-pdfjs/$PDF_TGZ" -C "$RUNNER_TEMP/alfiq-pdfjs" package/build/pdf.mjs package/build/pdf.worker.mjs package/LICENSE
          cp "$RUNNER_TEMP/alfiq-pdfjs/package/build/pdf.mjs" site/alfiq/vendor/pdf.mjs
          cp "$RUNNER_TEMP/alfiq-pdfjs/package/build/pdf.worker.mjs" site/alfiq/vendor/pdf.worker.mjs
          cp "$RUNNER_TEMP/alfiq-pdfjs/package/LICENSE" site/alfiq/vendor/PDFJS-LICENSE.txt
          MAMMOTH_TGZ=$(npm pack mammoth@1.13.0 --pack-destination "$RUNNER_TEMP/alfiq-mammoth" --silent)
          tar -xzf "$RUNNER_TEMP/alfiq-mammoth/$MAMMOTH_TGZ" -C "$RUNNER_TEMP/alfiq-mammoth" package/mammoth.browser.min.js package/LICENSE
          cp "$RUNNER_TEMP/alfiq-mammoth/package/mammoth.browser.min.js" site/alfiq/vendor/mammoth.browser.min.js
          cp "$RUNNER_TEMP/alfiq-mammoth/package/LICENSE" site/alfiq/vendor/MAMMOTH-LICENSE.txt

      - name: Apply site-wide email composer to assembled PayScale pages
        run: |
          cp root-site/site-email.js site/payscale-2026/site-email.js
          python3 - <<'PY'
          from pathlib import Path

          for page in Path("site/payscale-2026").glob("*.html"):
              content = page.read_text(encoding="utf-8")
              if "site-email.js" not in content:
                  content = content.replace(
                      "</body>",
                      '<script src="./site-email.js" defer></script></body>',
                  )
              page.write_text(content, encoding="utf-8")
          PY


 
      - name: Preload Bengali font on PayScale pages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          site = Path("site/payscale-2026")
          font = site / "NotoSansBengali.ttf"
          if not font.is_file():
              raise SystemExit("Expected Bengali font missing from pinned PayScale source")

          preload = '<link rel="preload" href="/payscale-2026/NotoSansBengali.ttf" as="font" type="font/ttf" crossorigin>'
          for page in (site / "index.html", site / "pension.html"):
              if not page.is_file():
                  raise SystemExit(f"Expected PayScale page missing: {page}")
              content = page.read_text(encoding="utf-8")
              existing = [line for line in content.splitlines() if "NotoSansBengali.ttf" in line]
              if existing:
                  if len(existing) != 1 or 'rel="preload"' not in existing[0] or 'as="font"' not in existing[0] or "crossorigin" not in existing[0]:
                      raise SystemExit(f"Existing Bengali font preload is incomplete or duplicated: {page}")
              else:
                  marker = '<link rel="stylesheet"'
                  position = content.lower().find(marker)
                  if position < 0:
                      raise SystemExit(f"Stylesheet insertion point missing: {page}")
                  content = content[:position] + preload + "\n    " + content[position:]
              if content.count("NotoSansBengali.ttf") != 1:
                  raise SystemExit(f"Font preload count is not exactly one: {page}")
              page.write_text(content, encoding="utf-8")
              print(f"PASS: Preloaded Bengali font on {page}")
          PY

      - name: Use optimized WebP logo on PayScale footer
        run: python3 root-site/.github/scripts/payscale_logo_webp.py --site-dir site

      - name: Apply unified site header/footer styles
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          site = Path("site")
          stylesheet = '<link rel="stylesheet" href="/site-wide-shell.css?v=20261119-mobile-back-home-v5" data-rt-shell-latest="true" data-regtech-site-shell="true">'
          protected = {
              "index.html",
              "googleb678d3f045b8f91e.html",
              "fintech-intelligence-hub/googleb678d3f045b8f91e.html",
          }
          for page in site.rglob("*.html"):
              relative = page.relative_to(site).as_posix()
              # PayScale ships its own page-specific visual system. The global shell
              # treats every <header> and <footer> as the site shell, overriding
              # PayScale's hero, form/output contrast and footer layout. Keep
              # PayScale pages on their own stylesheets; do not alter calculations.
              if relative.startswith("payscale-2026/"):
                  continue
              if relative in protected:
                  continue
              content = page.read_text(encoding="utf-8")
              # Replace an older relative reference, if present, so nested pages use the same root asset.
              content = re.sub(r"""<link\b[^>]*href=["'][^"']*site-wide-shell\.css(?:\?[^"']*)?["'][^>]*>""", "", content, flags=re.I)
              if "</head>" not in content.lower():
                  continue
              match = re.search(r"</head>", content, flags=re.I)
              content = content[:match.start()] + "  " + stylesheet + "\n" + content[match.start():]
              page.write_text(content, encoding="utf-8")
          PY
          touch site/.nojekyll

      - name: Apply and validate page-specific SEO metadata
        run: |
          set -euo pipefail
          python3 -m json.tool root-site/seo-config.json >/dev/null
          python3 root-site/scripts/apply_seo_metadata.py --site-dir site --config root-site/seo-config.json
          python3 root-site/scripts/apply_seo_metadata.py --site-dir site --config root-site/seo-config.json --check
          python3 root-site/scripts/audit_site_quality.py --site-dir site --config root-site/seo-config.json --output "$RUNNER_TEMP/site-quality-report.md"
          cat "$RUNNER_TEMP/site-quality-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
