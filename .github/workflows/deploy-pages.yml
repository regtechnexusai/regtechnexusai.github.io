name: Deploy RegTech Nexus AI site

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout root site
        uses: actions/checkout@v4
        with:
          path: root-site

      - name: Checkout TradeGuard
        uses: actions/checkout@v4
        with:
          repository: regtechnexusai/tradeguard
          ref: main
          path: site/tradeguard

      - name: Assemble site
        run: |
          mkdir -p site

          find root-site -maxdepth 1 -type f \
            \( -name '*.html' \
            -o -name '*.css' \
            -o -name '*.js' \
            -o -name '*.jpg' \
            -o -name '*.jpeg' \
            -o -name '*.png' \
            -o -name '*.svg' \
            -o -name '*.webp' \
            -o -name '*.ico' \
           
