      - name: Assemble site
        run: |
          mkdir -p site

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.md' \
            --exclude='payscale-2026' \
            --exclude='PayScale-2026-calculator' \
            root-site/ site/

          mkdir -p site/payscale-2026
          rsync -a root-site/PayScale-2026-calculator/ site/payscale-2026/

          touch site/.nojekyll
