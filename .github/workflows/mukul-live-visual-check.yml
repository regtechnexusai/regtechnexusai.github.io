name: MUKUL live deployment screenshot verification

on:
  workflow_run:
    workflows: ["Deploy RegTech Nexus AI site"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser-check:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check live MUKUL site and capture screenshots
        env:
          MUKUL_LIVE_URL: https://regtechnexusai.github.io/mukul/
        run: node tests/mukul/live-visual-check.cjs
      - name: Upload live verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mukul-live-deployment-screenshots
          path: artifacts/mukul-live-*.png
          if-no-files-found: warn
          retention-days: 30
