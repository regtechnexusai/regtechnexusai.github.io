name: GaaS Phase B Isolated Queue Worker Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY-ISOLATED-PHASEB-QUEUE-TEST to deploy the isolated Queue consumer Worker"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gaas-phaseb-isolated-queue-worker
  cancel-in-progress: false

jobs:
  deploy-isolated-queue-worker:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY-ISOLATED-PHASEB-QUEUE-TEST' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gaas/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Cloudflare deployment secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Validate isolated configuration
        run: |
          set -euo pipefail
          test -f wrangler.phaseb-queue-test.toml.example
          grep -q '^name = "gaas-phaseb-queue-test"$' wrangler.phaseb-queue-test.toml.example
          grep -q 'database_name = "gaas-phaseb-disposable-20261111"' wrangler.phaseb-queue-test.toml.example
          grep -q 'queue = "gaas-phaseb-test-jobs"' wrangler.phaseb-queue-test.toml.example
          grep -q 'queue = "gaas-phaseb-test-dlq"' wrangler.phaseb-queue-test.toml.example
          grep -q 'PHASEB_QUEUE_TEST_MODE = "true"' wrangler.phaseb-queue-test.toml.example
          if grep -Eq 'OPENAI_API_KEY|GEMINI_API_KEY|TURNSTILE_SECRET_KEY' wrangler.phaseb-queue-test.toml.example; then
            echo "Paid-provider or unrelated secret reference detected in isolated config."
            exit 1
          fi
      - name: Deploy isolated Queue consumer Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cp wrangler.phaseb-queue-test.toml.example wrangler.phaseb-queue-test.toml
          npx --yes wrangler@4 deploy --config wrangler.phaseb-queue-test.toml
      - name: Verify isolated Worker health endpoint
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error https://gaas-phaseb-queue-test.regtechnexusai.workers.dev/health)"
          echo "$response"
          echo "$response" | grep -q '"status":"ok"'
