<h1>Standard Mathematics Formulas</h1>
<p class="lead">A structured cross-level reference from primary/foundation mathematics through secondary, intermediate/HSC-equivalent, undergraduate and postgraduate/advanced mathematics. English terminology is paired with Bangla labels where useful. Use the level selector first, then narrow by topic.</p>

<section id="learn" class="learning"><div class="wrap"><h2 class="section-title">How to Learn from a Formula</h2><p class="lead" style="font-size:.92rem">Use each formula as a learning unit: understand its meaning, verify its conditions, apply it in a worked example, then retrieve and practise it independently.</p><div class="learning-grid"><div class="learn-card"><strong>1 · Understand</strong><p>Identify the concept, formula type, symbols and mathematical meaning.</p></div><div class="learn-card"><strong>2 · Check conditions</strong><p>Confirm domain, restrictions, units and angle conventions before substitution.</p></div><div class="learn-card"><strong>3 · Apply</strong><p>Follow Given → Required → Formula → Substitution → Calculation → Answer.</p></div><div class="learn-card"><strong>4 · Retrieve</strong><p>Close the answer and solve a fresh problem without looking first.</p></div></div></div></section><section id="examples" class="examples"><div class="wrap"><h2 class="section-title">Worked Examples · ধারণা থেকে প্রয়োগ</h2><div class="example-grid"><article class="example"><h3>Quadratic Formula</h3><span class="academic-badge">Secondary · Algebra</span><div class="step"><strong>Given:</strong> x²−5x+6=0<br><strong>Formula:</strong> x=[−b±√(b²−4ac)]/(2a)</div><div class="step"><strong>Substitute:</strong> x=[5±√(25−24)]/2</div><div class="step answer">Answer: x=3 or x=2</div></article><article class="example"><h3>Pythagorean Theorem</h3><span class="academic-badge">School · Geometry</span><div class="step"><strong>Given:</strong> legs 6 cm and 8 cm.<br><strong>Formula:</strong> c²=a²+b²</div><div class="step"><strong>Calculation:</strong> c²=36+64=100</div><div class="step answer">Answer: c=10 cm</div></article><article class="example"><h3>Power Rule</h3><span class="academic-badge">HSC · Calculus</span><div class="step"><strong>Given:</strong> f(x)=x⁵<br><strong>Rule:</strong> d(xⁿ)/dx=nxⁿ⁻¹</div><div class="step"><strong>Apply:</strong> f′(x)=5x⁴</div><div class="step answer">Answer: 5x⁴</div></article><article class="example"><h3>Conditional Probability</h3><span class="academic-badge">HSC · Probability</span><div class="step"><strong>Given:</strong> P(A∩B)=0.2, P(B)=0.5.<br><strong>Formula:</strong> P(A|B)=P(A∩B)/P(B)</div><div class="step"><strong>Calculation:</strong> 0.2/0.5=0.4</div><div class="step answer">Answer: 0.4</div></article></div></div></section><section id="practice" class="practice"><div class="wrap"><h2 class="section-title">Practice &amp; Self-Check</h2><div class="practice-grid"><details class="practice-card"><summary>1 · Area</summary><p>Find the area of a circle with radius 7 cm.</p><p><strong>Answer:</strong> 49π cm².</p></details><details class="practice-card"><summary>2 · Explain</summary><p>Why must a≠0 in the quadratic formula?</p><p><strong>Answer:</strong> Otherwise the equation is not quadratic.</p></details><details class="practice-card"><summary>3 · Differentiate</summary><p>Find f′(x) for f(x)=3x⁴−2x²+7.</p><p><strong>Answer:</strong> 12x³−4x.</p></details><details class="practice-card"><summary>4 · Select a method</summary><p>A right triangle has legs 9 and 12. Which theorem finds the hypotenuse?</p><p><strong>Answer:</strong> Pythagorean theorem.</p></details><details class="practice-card"><summary>5 · Check a condition</summary><p>Can the ordinary power rule integrate x⁻¹?</p><p><strong>Answer:</strong> No; use ∫1/x dx=ln|x|+C.</p></details><details class="practice-card"><summary>6 · Coordinate geometry</summary><p>For y=2x+3, identify slope and y-intercept.</p><p><strong>Answer:</strong> m=2 and c=3.</p></details></div></div></section><section id="library"><div class="wrap">

function academicType(x){if(x.c.includes('Probability'))return 'Formula / probability rule';if(x.c.includes('Derivative')||x.c.includes('Calculus'))return 'Calculus rule / theorem';if(x.c.includes('Matrix')||x.c.includes('Linear Algebra'))return 'Linear algebra rule';if(x.c.includes('Coordinate'))return 'Coordinate-geometry formula';if(x.c.includes('Trigonometry'))return 'Identity / trigonometric formula';if(x.c.includes('Statistics'))return 'Statistical formula';if(x.c.includes('Algebra'))return 'Algebraic identity / rule';return 'Formula / mathematical rule'}function academicUse(x){if(x.c.includes('Quadratic'))return 'solving or classifying a quadratic equation';if(x.c.includes('Probability'))return 'computing the stated probability under the specified model';if(x.c.includes('Derivative')||x.c.includes('Calculus'))return 'differentiating a function or applying the stated calculus rule';if(x.c.includes('Integration'))return 'finding an antiderivative or definite integral under the stated conditions';return 'identify what is given, what is required, and whether the formula matches the problem'}function academicCheck(x){if(x.c.includes('Quadratic'))return 'a≠0; identify a, b and c before substitution';if(x.c.includes('Integration'))return 'check the exponent, domain and whether +C is required';if(x.c.includes('Trigonometry'))return 'state degree/radian convention where relevant';if(x.c.includes('Matrices'))return 'check dimensions and invertibility conditions';return 'verify variables, domain, restrictions and units where applicable'}function academicError(x){if(x.c.includes('Quadratic'))return 'dropping ± or misidentifying coefficients';if(x.c.includes('Probability'))return 'confusing conditional, joint and complementary probabilities';if(x.c.includes('Derivative'))return 'using the wrong differentiation rule';if(x.c.includes('Integration'))return 'forgetting +C or missing a special case';if(x.c.includes('Trigonometry'))return 'mixing degrees and radians';return 'applying the formula without checking its conditions'}const levels=[...new Set(F.map(x=>x.l))], cats=[...new Set(F.map(x=>x.c))];
const level=document.getElementById('level'), category=document.getElementById('category'), search=document.getElementById('search'), grid=document.getElementById('formulaGrid'), count=document.getElementById('count');
levels.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;level.appendChild(o)});
function refreshCats(){const old=category.value;category.innerHTML='<option value="All">All topics / সব বিষয়</option>';const set=[...new Set(F.filter(x=>x.l===level.value).map(x=>x.c))];set.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;category.appendChild(o)});if(set.includes(old))category.value=old}
function render(){const q=search.value.trim().toLowerCase(),lv=level.value,cat=category.value;const rows=F.filter(x=>x.l===lv&&(cat==='All'||x.c===cat)&&(!q||[x.c,x.t,x.f].join(' ').toLowerCase().includes(q)));grid.innerHTML='';rows.forEach(x=>{const a=document.createElement('article');a.className='card';a.innerHTML='<button class="copy-btn" type="button">Copy formula</button><h3>'+x.c+'</h3><div class="bn">'+x.t+'</div><div class="formula">'+x.f+'</div><div class="detail"><span class="academic-badge">'+academicType(x)+'</span><p><strong>When to use:</strong> '+academicUse(x)+'</p><p><strong>Academic check:</strong> '+academicCheck(x)+'</p><p><strong>Common error:</strong> '+academicError(x)+'</p><p><strong>Practice:</strong> solve a fresh problem using Given → Required → Formula → Substitution → Answer.</p></div>';a.querySelector('.copy-btn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(x.f);a.querySelector('.copy-btn').textContent='Copied'}catch(e){a.querySelector('.copy-btn').textContent='Copy unavailable'}});grid.appendChild(a)});count.innerHTML='<span class="pill">'+rows.length+' formulas shown</span><span class="pill">'+lv+'</span>'+(cat!=='All'?'<span class="pill">'+cat+'</span>':'');if(!rows.length)grid.innerHTML='<div class="empty">No formulas match this filter. Try “All topics” or clear the search.</div>'}
level.value=levels[0];refreshCats();render();
level.addEventListener('change',()=>{refreshCats();render()});category.addEventListener('change',render);search.addEventListener('input',render);
